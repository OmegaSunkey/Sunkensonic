name: "Build Release APK"

concurrency:
    group: "Build"
    cancel-in-progress: true

on:
    workflow_dispatch:
    push:
        tags:
          - '**'

permissions:
    contents: write

jobs:
    build:
        name: Build APK
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup JDK 21
              uses: actions/setup-java@v5
              with:
                java-version: 21
                distribution: temurin

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v5

            - name: Build
              env:
                KEYSTORE_BASE64: ${{ secrets.KEYSTORE_B64 }}
                KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
                KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
              run: |
                chmod +x ./gradlew
                ./gradlew :app:assembleRelease
                echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
                jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore keystore.jks -storepass $KEYSTORE_PASSWORD app/build/outputs/apk/release/app-release-unsigned.apk $KEYSTORE_ALIAS
                $ANDROID_HOME/build-tools/36.0.0/zipalign -v -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/Sunkensonic.apk

            - name: Create release
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                gh release create "$GITHUB_REF_NAME" \
                    --repo="$GITHUB_REPOSITORY" \
                    --title="Release ${GITHUB_REF_NAME#v}" \
                    --notes-from-tag
            
            - name: Release APK
              uses: softprops/action-gh-release@v3
              with:
                working_directory: app/build/outputs/apk/release
                files: Sunkensonic.apk
